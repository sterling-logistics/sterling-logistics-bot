name: Build Sterling Tracker
# Pull requests run the same Windows build so CI status and artifacts are verifiable before merge.

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/SterlingTracker.Desktop/**'
      - 'installer/**'
      - '.github/workflows/release-sterling-tracker.yml'
  pull_request:
    paths:
      - 'desktop/SterlingTracker.Desktop/**'
      - 'installer/**'
      - '.github/workflows/release-sterling-tracker.yml'

permissions:
  contents: read
  issues: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish validation run ID
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runUrl = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $body = "Sterling Tracker 2.3.6 validation run started.`n`nRun ID: $env:GITHUB_RUN_ID`nCommit: $env:GITHUB_SHA`nRun: $runUrl"
          gh issue edit 5 --title "Sterling Tracker 2.3.6 validation RUNNING - $env:GITHUB_RUN_ID" --body $body
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish validation run ID.' }

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prepare Tracker 2.3.6 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Add-Type -AssemblyName System.Drawing
          $assetDir = '.\desktop\SterlingTracker.Desktop\Assets'
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null
          $icoPath = Join-Path $assetDir 'SterlingTracker.ico'
          $fs = [IO.File]::Open($icoPath, [IO.FileMode]::Create)
          [System.Drawing.SystemIcons]::Application.Save($fs)
          $fs.Dispose()
          if (-not (Test-Path $icoPath)) { throw 'Could not create SterlingTracker.ico' }

          $codePath = '.\desktop\SterlingTracker.Desktop\MainWindow.xaml.cs'
          $code = Get-Content $codePath -Raw
          $code = $code.Replace('http://45.43.163.175:8101', 'http://45.43.163.175:3000')
          if ($code -notmatch '45\.43\.163\.175:3000') { throw 'Live API endpoint patch failed' }
          Set-Content $codePath $code -Encoding utf8

          $xamlPath = '.\desktop\SterlingTracker.Desktop\MainWindow.xaml'
          $xaml = Get-Content $xamlPath -Raw
          $xaml = $xaml -replace '<Setter\s+Property="CharacterSpacing"\s+Value="[^"]*"\s*/>\s*', ''
          $xaml = $xaml -replace '\s+CharacterSpacing="[^"]*"', ''
          $xaml = $xaml.Replace('Sterling Tracker 2.0', 'Sterling Tracker 2.3.6')
          $xaml = $xaml.Replace('TRACKER 2.0', 'TRACKER 2.3.6')
          $xaml = $xaml.Replace('v2.0.0', 'v2.3.6').Replace('v2.3.1', 'v2.3.6').Replace('v2.3.2', 'v2.3.6').Replace('v2.3.3', 'v2.3.6').Replace('v2.3.4', 'v2.3.6').Replace('v2.3.5', 'v2.3.6')
          Set-Content $xamlPath $xaml -Encoding utf8

          $projectPath = '.\desktop\SterlingTracker.Desktop\SterlingTracker.Desktop.csproj'
          $project = Get-Content $projectPath -Raw
          $project = $project.Replace('net10.0-windows', 'net8.0-windows')
          $project = $project -replace '<Version>[^<]+</Version>', '<Version>2.3.6</Version>'
          $project = $project -replace '<AssemblyVersion>[^<]+</AssemblyVersion>', '<AssemblyVersion>2.3.6.0</AssemblyVersion>'
          $project = $project -replace '<FileVersion>[^<]+</FileVersion>', '<FileVersion>2.3.6.0</FileVersion>'
          [xml]$null = $project
          Set-Content $projectPath $project -Encoding utf8

          $installerPath = '.\installer\SterlingTracker.iss'
          $installer = Get-Content $installerPath -Raw
          $installer = $installer -replace '#define MyAppVersion "[^"]+"', '#define MyAppVersion "2.3.6"'
          $installer = $installer -replace 'OutputBaseFilename=SterlingTracker-[^\r\n]+-Setup', 'OutputBaseFilename=SterlingTracker-2.3.6-Setup'
          $installer = $installer -replace 'UninstallDisplayName="Sterling Tracker [^"]+"', 'UninstallDisplayName="Sterling Tracker 2.3.6"'
          $installer = $installer -replace 'Name: "\{autoprograms\}\\Sterling Tracker [^"]+"', 'Name: "{autoprograms}\Sterling Tracker 2.3.6"'
          $installer = $installer -replace 'Name: "\{autodesktop\}\\Sterling Tracker [^"]+"', 'Name: "{autodesktop}\Sterling Tracker 2.3.6"'
          Set-Content $installerPath $installer -Encoding utf8

      - name: Add pinned ETS2 telemetry client
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $temp = Join-Path $env:RUNNER_TEMP 'rencloud-scs'
          git clone --depth 1 --branch V.1.12.1 https://github.com/RenCloud/scs-sdk-plugin.git $temp
          if ($LASTEXITCODE -ne 0) { throw 'RenCloud clone failed' }
          $source = Join-Path $temp 'scs-client\C#\SCSSdkClient'
          $dest = '.\desktop\SterlingTracker.Desktop\Vendor\SCSSdkClient'
          Remove-Item $dest -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item (Join-Path $source '*.cs') $dest -Force
          Copy-Item (Join-Path $source 'Object') (Join-Path $dest 'Object') -Recurse -Force
          if (-not (Test-Path (Join-Path $dest 'SCSSdkTelemetry.cs'))) { throw 'SCSSdkTelemetry.cs missing' }
          if (-not (Test-Path (Join-Path $dest 'SharedMemory.cs'))) { throw 'SharedMemory.cs missing' }

      - name: Restore
        shell: pwsh
        run: dotnet restore .\desktop\SterlingTracker.Desktop\SterlingTracker.Desktop.csproj -r win-x64

      - name: Publish Windows app
        shell: pwsh
        run: |
          dotnet publish .\desktop\SterlingTracker.Desktop\SterlingTracker.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishTrimmed=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o .\publish\SterlingTracker
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed' }
          if (-not (Test-Path '.\publish\SterlingTracker\SterlingTracker.exe')) { throw 'SterlingTracker.exe was not produced' }

      - name: Bundle ETS2 telemetry plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $temp = Join-Path $env:RUNNER_TEMP 'sterling-plugin'
          $zip = Join-Path $temp 'plugin.zip'
          $extract = Join-Path $temp 'plugin'
          $dest = '.\publish\SterlingTracker\Telemetry'
          New-Item -ItemType Directory -Force -Path $temp,$extract,$dest | Out-Null
          Invoke-WebRequest 'https://github.com/RenCloud/scs-sdk-plugin/releases/download/V.1.12.1/release_v_1_12_1.zip' -OutFile $zip
          Expand-Archive $zip -DestinationPath $extract -Force
          $plugin = Get-ChildItem $extract -Filter 'scs-telemetry.dll' -Recurse | Where-Object { $_.FullName -match 'Win64|win_x64|x64' } | Select-Object -First 1
          if (-not $plugin) { throw 'x64 scs-telemetry.dll was not found' }
          Copy-Item $plugin.FullName (Join-Path $dest 'scs-telemetry.dll') -Force
          if (-not (Test-Path (Join-Path $dest 'scs-telemetry.dll'))) { throw 'Telemetry plugin was not bundled' }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\dist | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' .\installer\SterlingTracker.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
          $installer = '.\dist\SterlingTracker-2.3.6-Setup.exe'
          if (-not (Test-Path $installer)) { throw 'Installer was not created' }
          if ((Get-Item $installer).Length -lt 1000000) { throw 'Installer output is unexpectedly small' }
          Get-FileHash $installer -Algorithm SHA256 | Format-List

      - name: Upload Sterling Tracker 2.3.6
        uses: actions/upload-artifact@v4
        with:
          name: DOWNLOAD-Sterling-Tracker-2.3.6
          path: dist/SterlingTracker-2.3.6-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish validation result
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          $runUrl = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $body = "Sterling Tracker 2.3.6 validation finished.`n`nStatus: $env:JOB_STATUS`nRun ID: $env:GITHUB_RUN_ID`nCommit: $env:GITHUB_SHA`nRun: $runUrl"
          gh issue edit 5 --title "Sterling Tracker 2.3.6 validation $($env:JOB_STATUS.ToUpper()) - $env:GITHUB_RUN_ID" --body $body
