name: Release Sterling Tracker

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/SterlingTracker.Desktop/**'
      - 'installer/**'
      - '.github/workflows/release-sterling-tracker.yml'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Windows app icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $assetDir = '.\desktop\SterlingTracker.Desktop\Assets'
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null
          $icoPath = Join-Path $assetDir 'SterlingTracker.ico'
          $fs = [IO.File]::Open($icoPath, [IO.FileMode]::Create)
          [System.Drawing.SystemIcons]::Application.Save($fs)
          $fs.Close()
          if (-not (Test-Path $icoPath)) { throw 'SterlingTracker.ico was not created.' }

      - name: Add ETS2 shared-memory client
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP 'rencloud-scs'
          git clone --depth 1 --branch V.1.12.1 https://github.com/RenCloud/scs-sdk-plugin.git $temp
          $source = Join-Path $temp 'scs-client\C#\SCSSdkClient'
          $dest = '.\desktop\SterlingTracker.Desktop\Vendor\SCSSdkClient'
          Remove-Item $dest -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item (Join-Path $source '*.cs') $dest -Force
          Copy-Item (Join-Path $source 'Object') (Join-Path $dest 'Object') -Recurse -Force
          Copy-Item (Join-Path $temp 'LICENSE') (Join-Path $dest 'RENCloud-LICENSE.txt') -Force

      - name: Prepare live production endpoint
        shell: pwsh
        run: |
          $codePath = '.\desktop\SterlingTracker.Desktop\MainWindow.xaml.cs'
          $code = Get-Content $codePath -Raw
          $code = $code.Replace('const string ApiBase = "http://45.43.163.175:8101";', 'const string ApiBase = "http://45.43.163.175:3000";')
          if ($code -notmatch '45\.43\.163\.175:3000') { throw 'Sterling live API endpoint was not applied.' }
          Set-Content -Path $codePath -Value $code -Encoding utf8

          $xamlPath = '.\desktop\SterlingTracker.Desktop\MainWindow.xaml'
          $xaml = Get-Content $xamlPath -Raw
          $xaml = $xaml -replace '<Setter\s+Property="CharacterSpacing"\s+Value="[^"]*"\s*/>\s*', ''
          $xaml = $xaml -replace '\s+CharacterSpacing="[^"]*"', ''
          $xaml = $xaml.Replace('Sterling Tracker 2.0', 'Sterling Tracker 2.3.2')
          Set-Content -Path $xamlPath -Value $xaml -Encoding utf8

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows tracker
        shell: pwsh
        run: |
          dotnet publish .\desktop\SterlingTracker.Desktop\SterlingTracker.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishTrimmed=false `
            -o .\publish\SterlingTracker
          if (-not (Test-Path '.\publish\SterlingTracker\SterlingTracker.exe')) { throw 'SterlingTracker.exe was not produced.' }

      - name: Bundle ETS2 telemetry plugin
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP 'sterling-plugin'
          $zip = Join-Path $temp 'plugin.zip'
          $extract = Join-Path $temp 'plugin'
          $dest = '.\publish\SterlingTracker\Telemetry'
          New-Item -ItemType Directory -Force -Path $temp,$extract,$dest | Out-Null
          Invoke-WebRequest 'https://github.com/RenCloud/scs-sdk-plugin/releases/download/V.1.12.1/release_v_1_12_1.zip' -OutFile $zip
          Expand-Archive $zip -DestinationPath $extract -Force
          $plugin = Get-ChildItem $extract -Filter 'scs-telemetry.dll' -Recurse | Where-Object { $_.FullName -match 'Win64|win_x64|x64' } | Select-Object -First 1
          if (-not $plugin) { $plugin = Get-ChildItem $extract -Filter 'scs-telemetry.dll' -Recurse | Select-Object -First 1 }
          if (-not $plugin) { throw 'scs-telemetry.dll was not found.' }
          Copy-Item $plugin.FullName (Join-Path $dest 'scs-telemetry.dll') -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\dist | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' .\installer\SterlingTracker.iss
          if (-not (Test-Path '.\dist\SterlingTracker-2.3.2-Setup.exe')) { throw 'Installer was not created.' }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DOWNLOAD-Sterling-Tracker-2.3.2
          path: dist/SterlingTracker-2.3.2-Setup.exe

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'tracker-v2.3.2'
          $asset = '.\dist\SterlingTracker-2.3.2-Setup.exe'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber
          } else {
            gh release create $tag $asset --target $env:GITHUB_SHA --title 'Sterling Tracker 2.3.2' --notes 'Sterling Logistics production tracker with direct ETS2 telemetry, Discord sign-in, live stats, job submission and staff approval flow.'
          }
