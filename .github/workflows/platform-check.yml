name: Sterling Platform Check

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

jobs:
  node-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Check server JavaScript
        run: npm run check
      - name: Check approval lifecycle
        run: npm run check:approval-flow
      - name: Check website assets
        run: |
          test -f website/index.html
          test -f website/about.html
          test -f website/drivers.html
          test -f website/jobs.html
          test -f website/leaderboards.html
          test -f website/convoys.html
          test -f website/tracker.html
          test -f website/recruitment.html
          test -f website/contact.html
          test -f website/dashboard.html
          test -f website/styles.css
          test -f website/app.js
          test -f website/dashboard.js
          node --check website/app.js
          node --check website/dashboard.js
          ! grep -R 'href="#"' website/*.html
