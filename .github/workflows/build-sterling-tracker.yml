name: Build Sterling Tracker

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/SterlingTracker.Desktop/**'
      - 'installer/**'
      - '.github/workflows/build-sterling-tracker.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Sterling app icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public static class NativeMethods {
            [DllImport("user32.dll", CharSet = CharSet.Auto)]
            public extern static bool DestroyIcon(IntPtr handle);
          }
          "@
          $assetDir = '.\desktop\SterlingTracker.Desktop\Assets'
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null
          $b64 = (Get-Content "$assetDir\SterlingTracker.ico.b64" -Raw).Trim()
          $pngPath = "$assetDir\SterlingTracker.png"
          $icoPath = "$assetDir\SterlingTracker.ico"
          [IO.File]::WriteAllBytes($pngPath, [Convert]::FromBase64String($b64))
          $bmp = New-Object System.Drawing.Bitmap($pngPath)
          $hIcon = $bmp.GetHicon()
          $icon = [System.Drawing.Icon]::FromHandle($hIcon)
          $fs = [IO.File]::Open($icoPath, [IO.FileMode]::Create)
          $icon.Save($fs)
          $fs.Close()
          $icon.Dispose()
          $bmp.Dispose()
          [NativeMethods]::DestroyIcon($hIcon) | Out-Null

      - name: Add pinned RenCloud shared-memory client
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP 'rencloud-scs'
          git clone --depth 1 --branch V.1.12.1 https://github.com/RenCloud/scs-sdk-plugin.git $temp
          $source = Join-Path $temp 'scs-client\C#\SCSSdkClient'
          $dest = '.\desktop\SterlingTracker.Desktop\Vendor\SCSSdkClient'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item (Join-Path $source '*.cs') $dest -Force
          Copy-Item (Join-Path $source 'Object') (Join-Path $dest 'Object') -Recurse -Force
          Copy-Item (Join-Path $temp 'LICENSE') (Join-Path $dest 'RENCloud-LICENSE.txt') -Force

      - name: Enforce Tracker 2.1 direct-telemetry build
        shell: pwsh
        run: |
          $xamlPath = '.\desktop\SterlingTracker.Desktop\MainWindow.xaml'
          $xaml = Get-Content $xamlPath -Raw
          $xaml = $xaml -replace '<Setter\s+Property="CharacterSpacing"\s+Value="[^"]*"\s*/>\s*', ''
          $xaml = $xaml -replace '\s+CharacterSpacing="[^"]*"', ''
          $xaml = $xaml.Replace('v1.3.0', 'v2.1.0').Replace('v2.0.0', 'v2.1.0')
          $xaml = $xaml.Replace('Sterling Tracker 2.0', 'Sterling Tracker 2.1').Replace('TRACKER 2.0', 'TRACKER 2.1')
          Set-Content -Path $xamlPath -Value $xaml -Encoding utf8

          $codePath = '.\desktop\SterlingTracker.Desktop\MainWindow.xaml.cs'
          $code = Get-Content $codePath -Raw
          $code = $code.Replace('DriverPayText', 'DriverShareText')
          $code = $code.Replace('_ = LiveLoop();', '_ = DirectLiveLoop();')
          $code = $code.Replace('Closed += (_, _) => running = false;', 'Closed += (_, _) => { running = false; directTelemetry.Dispose(); };')
          Set-Content -Path $codePath -Value $code -Encoding utf8

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained Windows app
        shell: pwsh
        run: |
          dotnet publish .\desktop\SterlingTracker.Desktop\SterlingTracker.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o .\publish\SterlingTracker

      - name: Bundle ETS2 telemetry plugin
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP 'sterling-plugin'
          $pluginZip = Join-Path $temp 'plugin.zip'
          $pluginExtract = Join-Path $temp 'plugin'
          $dest = '.\publish\SterlingTracker\Telemetry'
          New-Item -ItemType Directory -Force -Path $temp,$pluginExtract,$dest | Out-Null
          Invoke-WebRequest 'https://github.com/RenCloud/scs-sdk-plugin/releases/download/V.1.12.1/release_v_1_12_1.zip' -OutFile $pluginZip
          Expand-Archive $pluginZip -DestinationPath $pluginExtract -Force
          $plugin = Get-ChildItem $pluginExtract -Filter 'scs-telemetry.dll' -Recurse | Where-Object { $_.FullName -match 'Win64|win_x64|x64' } | Select-Object -First 1
          if (-not $plugin) { $plugin = Get-ChildItem $pluginExtract -Filter 'scs-telemetry.dll' -Recurse | Select-Object -First 1 }
          if (-not $plugin) { throw 'scs-telemetry.dll was not found in upstream package' }
          Copy-Item $plugin.FullName (Join-Path $dest 'scs-telemetry.dll') -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\dist | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' .\installer\SterlingTracker.iss
          if (-not (Test-Path '.\dist\SterlingTracker-2.1.0-Setup.exe')) { throw 'Installer was not created' }

      - name: Upload driver installer
        uses: actions/upload-artifact@v4
        with:
          name: DOWNLOAD-Sterling-Tracker-2.1.0
          path: dist/SterlingTracker-2.1.0-Setup.exe

      - name: Upload developer portable build
        uses: actions/upload-artifact@v4
        with:
          name: DEV-ONLY-SterlingTracker-2.1.0-Portable
          path: publish/SterlingTracker/**
