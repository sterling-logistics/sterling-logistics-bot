name: Sterling Platform V2 CI

on:
  push:
    branches:
      - platform-2.0
    paths:
      - 'platform-v2/**'
      - '.github/workflows/platform-v2.yml'
  pull_request:
    paths:
      - 'platform-v2/**'
      - '.github/workflows/platform-v2.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform-v2/package.json
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
