name: Sterling Platform V2 CI

on:
  push:
    branches:
      - platform-2.0
    paths:
      - 'platform-v2/**'
      - 'src/platform-v2-apollo.js'
      - '.github/workflows/platform-v2.yml'
  pull_request:
    paths:
      - 'platform-v2/**'
      - 'src/platform-v2-apollo.js'
      - '.github/workflows/platform-v2.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: sterling-ci-root
          MYSQL_DATABASE: sterling_v2
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psterling-ci-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 8200
      DATABASE_URL: mysql://root:sterling-ci-root@127.0.0.1:3306/sterling_v2
      JWT_ACCESS_SECRET: sterling-ci-access-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      JWT_REFRESH_SECRET: sterling-ci-refresh-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      STERLING_OWNER_USERNAME: sterling_ci_owner
      STERLING_OWNER_PASSWORD: Sterling-CI-Owner-Password-2026!
      STERLING_OWNER_DISPLAY_NAME: Sterling CI Owner
      STERLING_SMOKE_URL: http://127.0.0.1:8200
    defaults:
      run:
        working-directory: platform-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform-v2/package.json
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Apply database migrations
        run: npm run migrate
      - name: Prove migrations are idempotent
        run: npm run migrate
      - name: Bootstrap isolated Owner account
        run: npm run bootstrap:owner
      - name: Prove Owner bootstrap is restart-safe
        run: npm run bootstrap:owner
      - name: Start production build
        run: |
          npm start > /tmp/sterling-v2.log 2>&1 &
          echo $! > /tmp/sterling-v2.pid
      - name: Wait for healthy API
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8200/api/v2/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sterling-v2.log || true
          exit 1
      - name: Production smoke test
        run: node scripts/production-smoke.mjs
      - name: Stop test server
        if: always()
        run: |
          if [ -f /tmp/sterling-v2.pid ]; then kill $(cat /tmp/sterling-v2.pid) || true; fi
          cat /tmp/sterling-v2.log || true

  apollo-startup:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: sterling-apollo-root
          MYSQL_DATABASE: sterling_apollo
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psterling-apollo-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create Apollo environment
        run: |
          cat > platform-v2/.env <<'EOF'
          NODE_ENV=production
          HOST=127.0.0.1
          PORT=8201
          DATABASE_URL=mysql://root:sterling-apollo-root@127.0.0.1:3307/sterling_apollo
          JWT_ACCESS_SECRET=sterling-apollo-access-secret-0123456789-abcdefghijklmnopqrstuvwxyz
          JWT_REFRESH_SECRET=sterling-apollo-refresh-secret-0123456789-abcdefghijklmnopqrstuvwxyz
          ACCESS_TOKEN_TTL=15m
          REFRESH_TOKEN_DAYS=30
          STERLING_BOOTSTRAP_OWNER=1
          STERLING_OWNER_USERNAME=apollo_ci_owner
          STERLING_OWNER_PASSWORD=Sterling-Apollo-Owner-Password-2026!
          STERLING_OWNER_DISPLAY_NAME=Sterling Apollo CI Owner
          EOF
      - name: Run Apollo wrapper
        run: |
          node src/platform-v2-apollo.js > /tmp/sterling-apollo.log 2>&1 &
          echo $! > /tmp/sterling-apollo.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8201/api/v2/health > /dev/null; then
              cat /tmp/sterling-apollo.log
              exit 0
            fi
            if ! kill -0 $(cat /tmp/sterling-apollo.pid) 2>/dev/null; then
              cat /tmp/sterling-apollo.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/sterling-apollo.log
          exit 1
      - name: Verify Owner login
        run: |
          node - <<'NODE'
          const response = await fetch('http://127.0.0.1:8201/api/v2/auth/login', {
            method: 'POST',
            headers: {'content-type': 'application/json'},
            body: JSON.stringify({username: 'apollo_ci_owner', password: 'Sterling-Apollo-Owner-Password-2026!'})
          });
          if (!response.ok) throw new Error(`Owner login failed: ${response.status}`);
          const body = await response.json();
          if (body.user?.role !== 'owner') throw new Error('Owner role was not returned');
          console.log('Apollo Owner login verified.');
          NODE
      - name: Stop Apollo test server
        if: always()
        run: |
          if [ -f /tmp/sterling-apollo.pid ]; then kill $(cat /tmp/sterling-apollo.pid) || true; fi
          cat /tmp/sterling-apollo.log || true
